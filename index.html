<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluxo Diário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
  <div class="scene">
    <div class="shape cube"></div>
    <div class="shape sphere"></div>
    <div class="shape pyramid"></div>
    <div class="shape cube c2"></div>
    <div class="shape sphere s2"></div>
    <div class="shape pyramid p2"></div>
  </div>

  <header>
    <button id="theme-btn" aria-label="Alternar tema">◐</button>
    <h1>Fluxo Diário</h1>
    <p>Rotina • To-Do List</p>
  </header>

  <main class="grid">
    <article class="card" data-id="manha">
      <div class="icon">🌅</div>
      <h2>Manhã</h2>
      <p>5h30 – 7h</p>
    </article>
    <article class="card" data-id="escola">
      <div class="icon">🏫</div>
      <h2>Escola</h2>
      <p>7h – 12h</p>
    </article>
    <article class="card" data-id="almoco">
      <div class="icon">🍽️</div>
      <h2>Almoço</h2>
      <p>12h – 13h30</p>
    </article>
    <article class="card" data-id="treino">
      <div class="icon">💪</div>
      <h2>Calistenia</h2>
      <p>Tarde</p>
    </article>
    <article class="card" data-id="estudo">
      <div class="icon">📚</div>
      <h2>Estudo</h2>
      <p>Tarde / noite</p>
    </article>
    <article class="card" data-id="noite">
      <div class="icon">🌙</div>
      <h2>Noite</h2>
      <p>Encerramento</p>
    </article>
  </main>

  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="close">&times;</button>
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    const data = {
      manha: {
        title: "Manhã (5h30 – 7h)",
        items: ["Acordar 5h30", "Água + alongamento", "Café da manhã", "Organizar mochila", "Sair de casa"]
      },
      escola: {
        title: "Escola (7h – 12h)",
        items: ["Aula 1", "Aula 2", "Intervalo", "Aula 3", "Aula 4", "Voltar pra casa"]
      },
      almoco: {
        title: "Almoço (12h – 13h30)",
        items: ["Almoçar", "Descansar um pouco", "Organizar material"]
      },
      treino: {
        title: "Calistenia (Tarde)",
        items: ["Aquecimento 5min", "Pull-ups / push-ups", "Core (plank)", "Alongamento"]
      },
      estudo: {
        title: "Estudo",
        items: ["Revisar matérias do dia", "Pomodoro 25/5", "Exercícios", "Anotar dúvidas"]
      },
      noite: {
        title: "Noite",
        items: ["Jantar", "Organizar amanhã", "Leitura ou lazer", "Dormir 22h"]
      }
    };

    const modal = document.getElementById("modal");
    const title = document.getElementById("modal-title");
    const body = document.getElementById("modal-body");
    const closeBtn = document.querySelector(".close");
    const themeBtn = document.getElementById("theme-btn");

    function getChecks(id) {
      return JSON.parse(localStorage.getItem("todo-" + id) || "{}");
    }
    function saveCheck(id, index, checked) {
      const checks = getChecks(id);
      checks[index] = checked;
      localStorage.setItem("todo-" + id, JSON.stringify(checks));
    }

    document.querySelectorAll(".card").forEach(card => {
      card.addEventListener("click", () => {
        const id = card.dataset.id;
        const info = data[id];
        const checks = getChecks(id);
        title.textContent = info.title;
        body.innerHTML = "<ul class='todo-list'>" + info.items.map((item, i) => {
          const checked = checks[i] ? "checked" : "";
          return `<li><label><input type="checkbox" data-id="${id}" data-i="${i}" ${checked}> <span>${item}</span></label></li>`;
        }).join("") + "</ul>";
        modal.classList.add("open");

        body.querySelectorAll("input[type=checkbox]").forEach(cb => {
          cb.addEventListener("change", () => {
            saveCheck(cb.dataset.id, cb.dataset.i, cb.checked);
            cb.nextElementSibling.classList.toggle("done", cb.checked);
          });
          if (cb.checked) cb.nextElementSibling.classList.add("done");
        });
      });
    });

    closeBtn.addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", e => {
      if (e.target === modal) modal.classList.remove("open");
    });

    themeBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      document.body.classList.toggle("light");
    });
  </script>
</body>
</html>
