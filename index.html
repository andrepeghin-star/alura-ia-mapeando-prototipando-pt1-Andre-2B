<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluxo Diário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
  <div class="scene">
    <div class="shape cube"></div>
    <div class="shape sphere"></div>
    <div class="shape pyramid"></div>
    <div class="shape cube c2"></div>
    <div class="shape sphere s2"></div>
    <div class="shape pyramid p2"></div>
  </div>

  <header>
    <button id="theme-btn" aria-label="Alternar tema">◐</button>
    <h1>Fluxo Diário</h1>
    <p>Rotina completa • To-Do</p>
  </header>

  <main class="grid">
    <article class="card" data-id="manha">
      <div class="icon">🌅</div>
      <h2>Manhã</h2>
      <p>Começo do dia</p>
    </article>
    <article class="card" data-id="treino">
      <div class="icon">💪</div>
      <h2>Treino</h2>
      <p>Calistenia leve</p>
    </article>
    <article class="card" data-id="estudo">
      <div class="icon">📚</div>
      <h2>Estudo</h2>
      <p>Foco e aprendizado</p>
    </article>
    <article class="card" data-id="trabalho">
      <div class="icon">💼</div>
      <h2>Trabalho</h2>
      <p>Produtividade</p>
    </article>
    <article class="card" data-id="lazer">
      <div class="icon">🎮</div>
      <h2>Lazer</h2>
      <p>Recarga</p>
    </article>
    <article class="card" data-id="noite">
      <div class="icon">🌙</div>
      <h2>Noite</h2>
      <p>Encerramento</p>
    </article>
  </main>

  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="close">&times;</button>
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    const data = {
      manha: {
        title: "Manhã",
        items: ["Acordar 6h30", "Água + alongamento", "Café da manhã", "Planejar o dia"]
      },
      treino: {
        title: "Treino",
        items: ["Aquecimento 5min", "Pull-ups / push-ups", "Core (plank / lever)", "Alongamento final"]
      },
      estudo: {
        title: "Estudo",
        items: ["Pomodoro 25/5", "Revisão ativa", "Exercícios práticos", "Anotar dúvidas"]
      },
      trabalho: {
        title: "Trabalho",
        items: ["Prioridades do dia", "Deep work 2h", "Pausas curtas", "Revisar entregas"]
      },
      lazer: {
        title: "Lazer",
        items: ["Caminhada ou série", "Hobby livre", "Conversa com amigos", "Música"]
      },
      noite: {
        title: "Noite",
        items: ["Jantar leve", "Organizar amanhã", "Leitura relaxante", "Dormir 22h30"]
      }
    };

    const modal = document.getElementById("modal");
    const title = document.getElementById("modal-title");
    const body = document.getElementById("modal-body");
    const closeBtn = document.querySelector(".close");
    const themeBtn = document.getElementById("theme-btn");

    document.querySelectorAll(".card").forEach(card => {
      card.addEventListener("click", () => {
        const id = card.dataset.id;
        const info = data[id];
        title.textContent = info.title;
        body.innerHTML = "<ul>" + info.items.map(i => `<li>${i}</li>`).join("") + "</ul>";
        modal.classList.add("open");
      });
    });

    closeBtn.addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", e => {
      if (e.target === modal) modal.classList.remove("open");
    });

    themeBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      document.body.classList.toggle("light");
    });
  </script>
</body>
</html>
