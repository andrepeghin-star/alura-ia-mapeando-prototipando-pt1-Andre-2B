<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street Force</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
  <div class="scene">
    <div class="shape cube"></div>
    <div class="shape sphere"></div>
    <div class="shape pyramid"></div>
    <div class="shape cube c2"></div>
    <div class="shape sphere s2"></div>
    <div class="shape pyramid p2"></div>
  </div>

  <header>
    <button id="theme-btn" aria-label="Alternar tema">◐</button>
    <h1>Street Force</h1>
    <p>Calistenia & Street Workout</p>
  </header>

  <main class="grid">
    <article class="card" data-id="planche">
      <div class="icon">💪</div>
      <h2>Planche</h2>
      <p>Força horizontal</p>
    </article>
    <article class="card" data-id="handstand">
      <div class="icon">🤸</div>
      <h2>Handstand</h2>
      <p>Equilíbrio invertido</p>
    </article>
    <article class="card" data-id="frontlever">
      <div class="icon">🏋️</div>
      <h2>Front Lever</h2>
      <p>Controle total</p>
    </article>
    <article class="card" data-id="muscleup">
      <div class="icon">🔥</div>
      <h2>Muscle Up</h2>
      <p>Potência explosiva</p>
    </article>
    <article class="card" data-id="humanflag">
      <div class="icon">🚩</div>
      <h2>Human Flag</h2>
      <p>Força lateral</p>
    </article>
    <article class="card" data-id="backlever">
      <div class="icon">🌀</div>
      <h2>Back Lever</h2>
      <p>Mobilidade + força</p>
    </article>
  </main>

  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="close">&times;</button>
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    const data = {
      planche: {
        title: "Planche",
        items: ["Tuck planche holds", "Advanced tuck", "Straddle planche", "Full planche progressions"]
      },
      handstand: {
        title: "Handstand",
        items: ["Wall holds", "Freestanding balance", "Handstand push-up", "Press to handstand"]
      },
      frontlever: {
        title: "Front Lever",
        items: ["Tuck front lever", "Advanced tuck", "One-leg lever", "Full front lever"]
      },
      muscleup: {
        title: "Muscle Up",
        items: ["False grip pulls", "Transition drills", "Explosive pull-ups", "Bar & ring muscle-up"]
      },
      humanflag: {
        title: "Human Flag",
        items: ["Vertical flag holds", "Tuck flag", "Straddle flag", "Full human flag"]
      },
      backlever: {
        title: "Back Lever",
        items: ["German hangs", "Tuck back lever", "Advanced tuck", "Full back lever"]
      }
    };

    const modal = document.getElementById("modal");
    const title = document.getElementById("modal-title");
    const body = document.getElementById("modal-body");
    const closeBtn = document.querySelector(".close");
    const themeBtn = document.getElementById("theme-btn");

    document.querySelectorAll(".card").forEach(card => {
      card.addEventListener("click", () => {
        const id = card.dataset.id;
        const info = data[id];
        title.textContent = info.title;
        body.innerHTML = "<ul>" + info.items.map(i => `<li>${i}</li>`).join("") + "</ul>";
        modal.classList.add("open");
      });
    });

    closeBtn.addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", e => {
      if (e.target === modal) modal.classList.remove("open");
    });

    themeBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      document.body.classList.toggle("light");
    });
  </script>
</body>
</html>
